# Netlify Next.js plugin által kezelt deploy (publish könyvtárat nem adunk meg).
# Két külön Netlify site, ugyanabból a repóból (buildkor a Netlify URL alapján választ nyelvet: buildLocale.ts).
# Opcionális: NEXT_PUBLIC_LOCALE=en|hu — egyedi domainnál, ha az URL nem egyezik a SITE_URL_* hosttal.

[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # NEXT_PUBLIC_LOCALE=hu makes the HU build explicit so URL-based detection is not needed.
  # The EN Netlify site must override this with NEXT_PUBLIC_LOCALE=en in its dashboard.
  NEXT_PUBLIC_LOCALE = "hu"
  NEXT_PUBLIC_SITE_URL_HU = "https://bohemjazz.netlify.app"
  # Egy staging site: EN is /en/ path-prefix. GO-LIVE dashboard:
  # NEXT_PUBLIC_SITE_URL_HU=https://jazzfovaros.hu
  # NEXT_PUBLIC_SITE_URL_EN=https://jazzfovaros.hu
  NEXT_PUBLIC_SITE_URL_EN = "https://bohemjazz.netlify.app"
  NEXT_PUBLIC_GA4_ID = "G-Y9BMR7XZK6"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SANITY_DATASET,NEXT_PUBLIC_SANITY_API_VERSION"
